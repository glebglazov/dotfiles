ghostty:
  # The profiles (personal, work) only add a `command`, and Muxify starts
  # its own terminal command, so it loads the shared part directly.
  config_file: ~/.config/ghostty/shared

# The same Projects as pop's config.
sessions:
  paths:
    - path: ~/.local/share/chezmoi
    - path: ~/Dev/*/*
    - path: ~/Dev/mixed/obsidian_vaults/*
      display_depth: 2
  aliases:
    - ~/Dev/mixed/obsidian_vaults/glebglazov: My Obsidian

sidebar:
  # Only Window rows, in Topics and Sessions mode.
  panes: false
  agents:
    topics: true
  # The Agents section lists the Agents of the Active Topic.
  agents_scope:
    topics: window

  formats:
    window:
      left: '#{symbol:macwindow}'
      title: '#{window_index}:#{window_name}'
      summary: ''

# The default presets, with Evening added. '19:00' is the next 19:00 to come, so
# after 19:00 it is tomorrow evening.
topics:
  snooze_presets:
    - label: In one hour
      at: +1h
    - label: Evening
      at: '19:00'
    - label: Tomorrow
      at: tomorrow
    - label: Next Monday
      at: mon

# Hints at rest only, none while a modifier is held.
hints:
  hold_delay: false

keybindings:
  # cmd+s and cmd+b stay with Ghostty, which sends cmd+s to tmux (C-b s).
  toggle_sidebar: cmd+shift+s
  toggle_browser: cmd+shift+b
  toggle_terminal: cmd+shift+j
  toggle_maximize_browser: ctrl+minus
  # alt+0 goes to the Browser, after Tabs on alt+1..9. It takes the key from
  # focus_terminal's defaults.
  focus_browser: alt+0
  select_window_1: []
  select_window_2: []
  select_window_3: []
  select_window_4: []
  select_window_5: []
  select_window_6: []
  select_window_7: []
  select_window_8: []
  select_window_9: []
  # These take ⌘[ and ⌘] from Browser back and forward. They step through
  # every Window of the Active Topic, across its Sessions.
  select_prev_topic_window: cmd+left_bracket
  select_next_topic_window: cmd+right_bracket
  # These take ⌘⇧[ and ⌘⇧] from Browser Tab cycling, which keeps ⌃Tab.
  select_prev_topic: cmd+shift+left_bracket
  select_next_topic: cmd+shift+right_bracket
  # This takes the key from tmux's new session (cmd+shift+n) binding, but
  # only inside Muxify.
  new_topic: cmd+shift+n

# Go to… takes the key from Ghostty's pop project binding (cmd+p), but only
# inside Muxify.
command_palettes:
  - name: Commands
    keybinding: cmd+shift+p
    sources: [commands]
  - name: Go to…
    keybinding: cmd+p
    sources: [topics, sessions]
